services:
  postgres:
    image: postgres:16
    container_name: jmea_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jmea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jmea_dev_admin}
      POSTGRES_DB: ${POSTGRES_DB:-jmea}
      APP_PORTAL_PASSWORD: ${APP_PORTAL_PASSWORD:-portal_dev}
      TRANSFORM_PASSWORD: ${TRANSFORM_PASSWORD:-transform_dev}
      SVC_ANALYTICS_PASSWORD: ${SVC_ANALYTICS_PASSWORD:-analytics_dev}
      SVC_MATCHING_PASSWORD: ${SVC_MATCHING_PASSWORD:-matching_dev}
      LIGHTDASH_PG_PASSWORD: ${LIGHTDASH_PG_PASSWORD:-lightdash_dev}
    ports:
      # Loopback-only: not reachable from other hosts or VMs. Both loopback
      # stacks are bound so `localhost` works whether it resolves to 127.0.0.1
      # or ::1 (Windows/macOS resolvers often try ::1 first).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
      - "[::1]:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jmea_admin} -d $${POSTGRES_DB:-jmea}"]
      interval: 5s
      timeout: 3s
      retries: 10

  headless-browser:
    image: ghcr.io/browserless/chromium:v2.24.3
    restart: unless-stopped

  # Lightdash (0.3363.1) unconditionally requires S3-compatible object storage
  # to complete its startup DB migration (parseBaseS3Config() in
  # packages/backend/dist/config/parseConfig.js throws ParseError if
  # S3_ENDPOINT/S3_BUCKET/S3_REGION are unset), regardless of whether
  # pre-aggregates or usage-events features are enabled. minio + minio-init
  # provide a self-hosted bucket for this so lightdash can boot.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lightdash_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lightdash_dev_minio_pw}
    ports:
      # Loopback-only, same dual-stack pattern as postgres/lightdash. Lightdash's
      # own parseConfig.js documents S3_PUBLIC_ENDPOINT as needed in local dev
      # because the browser can't resolve the internal Docker hostname `minio` —
      # so the API port is published for that (not for direct end-user access).
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "[::1]:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lightdash_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lightdash_dev_minio_pw}
      LIGHTDASH_S3_BUCKET: ${LIGHTDASH_S3_BUCKET:-lightdash}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$LIGHTDASH_S3_BUCKET"

  lightdash:
    image: lightdash/lightdash:0.3363.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: lightdash
      PGPASSWORD: ${LIGHTDASH_PG_PASSWORD:-lightdash_dev}
      PGDATABASE: lightdash
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET:-jmea_dev_lightdash_secret}
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      PORT: 8080
      SITE_URL: ${LIGHTDASH_SITE_URL:-http://localhost:8080}
      HEADLESS_BROWSER_HOST: headless-browser
      HEADLESS_BROWSER_PORT: 3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${LIGHTDASH_S3_BUCKET:-lightdash}
      S3_REGION: ${LIGHTDASH_S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lightdash_dev}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lightdash_dev_minio_pw}
      S3_FORCE_PATH_STYLE: "true"
      # Browser-facing S3 endpoint for presigned URLs (see minio's port comment
      # above). Not read by any presigned-URL code path in lightdash 0.3363.1
      # (verified: S3BaseClient/S3Client/AppGenerateService only read `endpoint`,
      # not `publicEndpoint`) but it's Lightdash's own documented local-dev
      # config, kept for forward-compatibility with future versions/features.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
    ports:
      - "127.0.0.1:${LIGHTDASH_PORT:-8080}:8080"
      - "[::1]:${LIGHTDASH_PORT:-8080}:8080"
    volumes:
      - ../../transform:/usr/app/dbt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  pgdata:
  minio_data:
