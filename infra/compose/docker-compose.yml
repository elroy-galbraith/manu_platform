services:
  postgres:
    image: postgres:16
    container_name: jmea_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jmea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jmea_dev_admin}
      POSTGRES_DB: ${POSTGRES_DB:-jmea}
      APP_PORTAL_PASSWORD: ${APP_PORTAL_PASSWORD:-portal_dev}
      TRANSFORM_PASSWORD: ${TRANSFORM_PASSWORD:-transform_dev}
      SVC_ANALYTICS_PASSWORD: ${SVC_ANALYTICS_PASSWORD:-analytics_dev}
      SVC_MATCHING_PASSWORD: ${SVC_MATCHING_PASSWORD:-matching_dev}
      LIGHTDASH_PG_PASSWORD: ${LIGHTDASH_PG_PASSWORD:-lightdash_dev}
    ports:
      # Loopback-only: not reachable from other hosts or VMs. Both loopback
      # stacks are bound so `localhost` works whether it resolves to 127.0.0.1
      # or ::1 (Windows/macOS resolvers often try ::1 first).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
      - "[::1]:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jmea_admin} -d $${POSTGRES_DB:-jmea}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
