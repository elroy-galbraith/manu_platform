version: 2
models:
  - name: member_profile
    columns:
      - name: member_id
        tests: [unique, not_null]
      - name: readiness_score
        tests: [not_null]
  - name: sector_summary
    columns:
      - name: member_count
        tests: [not_null]
  - name: sector_energy
    columns:
      - name: member_count
        tests: [not_null]
  - name: supplier_directory
    columns:
      - name: member_id
        tests: [unique, not_null]
  - name: buyer_request
    columns:
      - name: request_id
        tests: [unique, not_null]
  - name: reference_stats
    columns:
      - name: stat_key
        tests: [unique, not_null]
      - name: provenance
        tests:
          - not_null
          - accepted_values:
              values: ["real", "simulated"]
